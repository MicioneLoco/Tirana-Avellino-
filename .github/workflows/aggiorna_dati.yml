name: Aggiorna dati Fantacalcio

on:
  schedule:
    - cron: "0 5 * * *"   # ogni giorno alle 5:00 UTC (le 6:00/7:00 in Italia)
  workflow_dispatch: {}     # bottone "Run workflow" per lanciarlo anche a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install -r requirements-pipeline.txt

      - name: Esegui la pipeline
        run: python pipeline.py

      - name: Salva i risultati nel repository (se sono cambiati)
        run: |
          git config user.name "fantacalcio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results_sample.csv
          git diff --quiet --cached || git commit -m "Aggiornamento dati automatico"
          git push
